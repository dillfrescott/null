# fly.toml file for dill-null-captcha

app = "dill-null-captcha"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "captcha_data"
  destination = "/app/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
