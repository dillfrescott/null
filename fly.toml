app = "null-captcha-jreoka"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "/app/data/captcha.db"
  NULL_CAPTCHA_DIFFICULTY = "4.0"
  NULL_CAPTCHA_MIN_SCORE = "0.5"
  PORT = "3000"
  URL = "https://null.dill.moe"

[[mounts]]
  source = "captcha_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
